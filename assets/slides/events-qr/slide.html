<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Events QR Slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Manrope:wght@400..800&display=block" rel="stylesheet">
<style>
  :root{
    --navy:#0d2530; --deep:#11303d; --teal:#1f6b7c; --river:#2e8fa3;
    --river-lt:#7fd0e0; --river-lt2:#5fc2d4; --gold-a:#e3bd6a; --gold-b:#c89a3e;
    --cream:#f6f1e6; --ink:#16242b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
  body{
    position:relative;
    background:linear-gradient(180deg,#0d2530,#11303d);
    color:var(--cream);
    font-family:'Manrope',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* soft light pools: teal behind the card, warm gold low-left behind the river */
  .glow{position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(900px 700px at 1430px 540px, rgba(46,143,163,.22), transparent 70%),
      radial-gradient(1000px 620px at 220px 1000px, rgba(227,189,106,.07), transparent 70%),
      radial-gradient(800px 520px at 260px 120px, rgba(127,208,224,.07), transparent 70%);
  }
  .river{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none}

  /* left column (title-safe: 112px from left; ends well before the card) */
  .left{position:absolute;left:112px;top:66px;bottom:66px;width:800px;
    display:flex;flex-direction:column}
  .logo{height:72px;width:auto;align-self:flex-start;filter:brightness(0) invert(1)}
  .copy{margin:auto 0;padding-bottom:40px}
  .eyebrow{display:flex;align-items:center;gap:22px;margin:0 0 34px;
    font-weight:800;font-size:32px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--gold-a)}
  .eyebrow::before{content:"";width:64px;height:3px;border-radius:2px;
    background:linear-gradient(90deg,var(--gold-a),var(--gold-b))}
  h1{margin:0 0 44px;font-family:'Fraunces',Georgia,serif;font-weight:340;
    font-size:176px;line-height:.96;letter-spacing:-.02em;color:#fff;
    font-variation-settings:"opsz" 144}
  h1 em{font-style:italic;font-weight:360;color:var(--river-lt)}
  .support{margin:0;font-size:38px;line-height:1.45;font-weight:500;color:var(--cream)}
  .support strong{font-weight:700;color:#fff}

  /* QR card: 803 wide, QR 627 (19px/module), 88px white each side, 80px on top */
  .card{position:absolute;left:1021px;top:60px;width:803px;height:960px;
    background:#ffffff;border-radius:24px;
    box-shadow:0 46px 90px rgba(3,14,20,.48),0 10px 24px rgba(3,14,20,.28);
    display:flex;flex-direction:column;align-items:center;overflow:hidden}
  .qr{display:block;flex:none;margin-top:80px;width:627px;height:627px}
  .cue{margin-top:75px;display:flex;align-items:center;gap:16px;
    font-size:36px;line-height:44px;font-weight:700;color:var(--navy)}
  .cue .cam{width:44px;height:44px;flex:none}
  .cue .up{width:30px;height:40px;flex:none;margin-left:4px}
  .url{margin-top:4px;font-size:52px;line-height:58px;font-weight:800;
    letter-spacing:-.01em;color:var(--navy);white-space:nowrap}
  .url span{color:var(--teal)}
  .card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;
    background:linear-gradient(90deg,var(--gold-a),var(--gold-b))}
</style>
</head>
<body>
  <div class="glow"></div>

  <!-- river motif: runs low across the slide and ends behind the card -->
  <svg class="river" viewBox="0 0 1920 1080" aria-hidden="true">
    <defs>
      <linearGradient id="rv" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#2e8fa3" stop-opacity="0"/>
        <stop offset=".3" stop-color="#2e8fa3" stop-opacity=".9"/>
        <stop offset="1" stop-color="#5fc2d4" stop-opacity=".7"/>
      </linearGradient>
      <linearGradient id="gd" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#e3bd6a" stop-opacity="0"/>
        <stop offset=".35" stop-color="#e3bd6a" stop-opacity=".95"/>
        <stop offset="1" stop-color="#c89a3e" stop-opacity=".6"/>
      </linearGradient>
    </defs>
    <g fill="none" stroke-linecap="round">
      <path d="M-60 975 C 200 868, 460 1030, 735 932 S 1160 790, 1480 866" stroke="url(#gd)" stroke-width="5" opacity=".7"/>
      <path d="M-60 1010 C 220 900, 480 1060, 760 960 S 1180 820, 1500 900" stroke="url(#rv)" stroke-width="6" opacity=".6"/>
      <path d="M-60 1040 C 240 935, 500 1085, 790 990 S 1200 855, 1520 935" stroke="url(#rv)" stroke-width="4" opacity=".45"/>
      <path d="M-60 1068 C 260 968, 520 1105, 820 1018 S 1220 888, 1540 968" stroke="url(#rv)" stroke-width="3" opacity=".32"/>
    </g>
  </svg>

  <div class="left">
    <img class="logo" alt="Arroyo Church" src="https://images.squarespace-cdn.com/content/v1/68532fdd269d6a05dbb80b84/d0643920-775c-4c1f-945b-9a8771e757cf/logo-black.png?format=500w">
    <div class="copy">
      <p class="eyebrow">Events &amp; calendar</p>
      <h1>See what&rsquo;s<br><em>coming up.</em></h1>
      <p class="support">Classes, baptisms, worship nights and more.<br><strong>Save your spot</strong> or add it to your calendar.</p>
    </div>
  </div>

  <div class="card">

    <div class="url">arroyochurch.com<span>/events</span></div>
  </div>
</body>
</html>
