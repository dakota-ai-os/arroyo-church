name: Sync YouTube sermons + podcasts

on:
  schedule:
    # PRIMARY: ~12:45am Monday, timed to the moment the sermon actually becomes fetchable.
    # The 10:00am Sunday LIVESTREAM never becomes a public video (the channel's Streams tab is
    # empty and no 10am entry ever appears in the uploads feed) — what gets published is a
    # separate, edited sermon-only video uploaded late Sunday night. Measured upload times:
    #   Jul 5 11:20pm · Jul 19 11:28pm · Jul 26 11:31pm · Aug 2 11:51pm · Jun 7 12:16am Mon
    # 12:45am Monday clears that whole window, so the new sermon reaches arroyochurch.com AND
    # links.arroyochurch.com (both read data/sermons.json) overnight instead of ~8am Monday.
    # GitHub's cron is UTC and does NOT follow daylight saving, so schedule BOTH hours that
    # can be 12:45am Monday in Livermore:
    - cron: '45 7 * * 1'        # 12:45am PDT (Mar–Nov) · 11:45pm PST Sun
    - cron: '45 8 * * 1'        # 12:45am PST (Nov–Mar) ·  1:45am PDT
    # BACKSTOP: an upload later than ~12:45am would otherwise wait for the 8am daily run.
    # A 6am Monday pass closes most of that gap. Same DST pairing as above.
    - cron: '0 13 * * 1'        # 6:00am PDT (Mar–Nov) · 5:00am PST
    - cron: '0 14 * * 1'        # 6:00am PST (Nov–Mar) · 7:00am PDT
    # SAFETY NET: keep the daily run. Sermons are sometimes uploaded later in the week, and
    # the sermon->blog generator reads data/sermons.json — a Sunday-only sync would miss a
    # late upload for a whole week. The job only commits when the data actually changed, so
    # the extra runs are harmless no-ops.
    - cron: '0 15 * * *'        # daily ~07:00–08:00 America/Los_Angeles
  workflow_dispatch:            # allow manual runs from the Actions tab

permissions:
  contents: write              # needed to commit refreshed data/*.json

concurrency:
  group: sync-youtube
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest sermons + podcasts
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}   # optional; RSS is used if absent
        run: node scripts/sync-youtube.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sermons.json data/podcasts.json
          if git diff --staged --quiet; then
            echo "No changes — sermons/podcasts already current."
          else
            git commit -m "Auto-sync sermons + podcasts from YouTube"
            git push
          fi
